<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Перенаправление…</title>
    <script>
      // ---------------------------------------------------------------
      // SPA-редирект для GitHub Pages.
      //
      // GitHub Pages не знает о клиентских маршрутах SPA и на любой
      // несуществующий путь отдаёт этот 404.html. Мы перехватываем
      // исходный путь и query-строку, кодируем их в hash-фрагмент и
      // переходим на index.html. Скрипт в index.html затем восстановит
      // исходный маршрут.
      //
      // Подробнее: https://github.com/rafgraph/spa-github-pages
      // ---------------------------------------------------------------
      (function () {
        var pathSegmentsToKeep = 1; // '/web-audit/...' — оставляем первый сегмент

        var l = window.location;
        var newPath =
          l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash;

        l.replace(newPath);
      })();
    </script>
  </head>
  <body>
    <p style="font-family: system-ui, sans-serif; padding: 2rem; color: #444">
      Перенаправление…
    </p>
  </body>
</html>
